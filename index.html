<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELLEI AI Mock Interview</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

header {
  background: #172033;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1, h2, h3 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

select,
textarea,
button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  font-size: 16px;
}

select,
textarea {
  border: 1px solid #ccd3df;
}

textarea {
  min-height: 180px;
  resize: vertical;
}

button {
  margin-top: 15px;
  border: none;
  background: #172033;
  color: white;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.secondary {
  background: #687386;
}

.hidden {
  display: none;
}

.progress {
  font-weight: bold;
  margin-bottom: 15px;
}

.question {
  font-size: 22px;
  font-weight: bold;
  line-height: 1.5;
  margin: 20px 0;
}

.badge {
  display: inline-block;
  padding: 6px 10px;
  background: #e8eef8;
  border-radius: 20px;
  margin-right: 5px;
  font-size: 13px;
}

.score {
  font-size: 30px;
  font-weight: bold;
  margin: 10px 0;
}

.report-item {
  padding: 15px;
  border-bottom: 1px solid #e5e9f0;
}

.error {
  background: #ffe8e8;
  color: #a40000;
  padding: 12px;
  border-radius: 10px;
  margin-top: 15px;
}

.loading {
  padding: 15px;
  background: #eef4ff;
  border-radius: 10px;
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
  <h1>VELLEI AI Mock Interview</h1>
  <p>AI-powered adaptive interview demo</p>
</header>

<div class="container">

  <!-- SETUP -->
  <section id="setupScreen" class="card">
    <h2>Start Mock Interview</h2>

    <label for="jobSelect">Select Target Role</label>

    <select id="jobSelect">
      <option>Python Developer</option>
      <option>Data Scientist</option>
      <option>ML Engineer</option>
      <option>GenAI Engineer</option>
      <option>Backend Developer</option>
    </select>

    <button onclick="startInterview()">
      Start AI Interview
    </button>
  </section>


  <!-- INTERVIEW -->
  <section id="interviewScreen" class="card hidden">

    <div class="progress" id="progress"></div>

    <div>
      <span class="badge" id="competency"></span>
      <span class="badge" id="questionType"></span>
    </div>

    <div class="question" id="questionText"></div>

    <label for="answerInput">Your Answer</label>

    <textarea
      id="answerInput"
      placeholder="Type your answer here..."
    ></textarea>

    <button id="submitButton" onclick="submitAnswer()">
      Submit Answer
    </button>

    <div id="status"></div>

  </section>


  <!-- REPORT -->
  <section id="reportScreen" class="card hidden">

    <h2>Interview Report</h2>

    <div id="overallScore"></div>

    <h3>Strengths</h3>
    <div id="strengths"></div>

    <h3>Skill Gaps</h3>
    <div id="gaps"></div>

    <h3>Recommendations</h3>
    <div id="recommendations"></div>

    <h3>Interview Transcript</h3>
    <div id="transcript"></div>

    <button onclick="location.reload()">
      Start New Interview
    </button>

  </section>

</div>


<script>

const state = {
  role: "",
  currentQuestion: 0,
  questions: [],
  answers: [],
  evaluations: [],
  followupActive: false,
  followupQuestion: "",
  originalQuestion: null
};


/* ---------------------------------------------------
   QUESTION BANK
--------------------------------------------------- */

const questionBank = {

  "Python Developer": [

    {
      competency: "Communication",
      type: "behavioral",
      text: "Tell me about yourself and your technical background."
    },

    {
      competency: "Python",
      type: "technical",
      text: "Explain your experience working with Python."
    },

    {
      competency: "Python Fundamentals",
      type: "technical",
      text: "What is the difference between a list, tuple and set in Python?"
    },

    {
      competency: "Project Experience",
      type: "project",
      text: "Tell me about a technical project you built using Python."
    },

    {
      competency: "Backend Architecture",
      type: "technical",
      text: "How would you design a backend API for an AI application?"
    }

  ],

  "Data Scientist": [

    {
      competency: "Communication",
      type: "behavioral",
      text: "Tell me about your data science background."
    },

    {
      competency: "Machine Learning",
      type: "technical",
      text: "Describe a machine learning project you have worked on."
    },

    {
      competency: "Data Preparation",
      type: "technical",
      text: "How would you handle missing data in a dataset?"
    },

    {
      competency: "Model Evaluation",
      type: "technical",
      text: "How would you evaluate a classification model?"
    },

    {
      competency: "Communication",
      type: "situational",
      text: "How would you explain a machine learning result to a non-technical stakeholder?"
    }

  ],

  "ML Engineer": [

    {
      competency: "ML Engineering",
      type: "behavioral",
      text: "Tell me about your machine learning engineering experience."
    },

    {
      competency: "Model Development",
      type: "technical",
      text: "Describe a machine learning model you implemented."
    },

    {
      competency: "ML Systems",
      type: "technical",
      text: "What is the difference between model training and inference?"
    },

    {
      competency: "Deployment",
      type: "technical",
      text: "How would you deploy a machine learning model to production?"
    },

    {
      competency: "Monitoring",
      type: "technical",
      text: "How would you monitor a machine learning system in production?"
    }

  ],

  "GenAI Engineer": [

    {
      competency: "GenAI",
      type: "behavioral",
      text: "Tell me about your Generative AI experience."
    },

    {
      competency: "LLM Architecture",
      type: "technical",
      text: "Explain the high-level architecture of an LLM application."
    },

    {
      competency: "RAG",
      type: "technical",
      text: "What is Retrieval Augmented Generation and why is it useful?"
    },

    {
      competency: "GenAI Project",
      type: "project",
      text: "Describe a Generative AI project you have built."
    },

    {
      competency: "AI Reliability",
      type: "technical",
      text: "How would you reduce hallucinations in a Generative AI application?"
    }

  ],

  "Backend Developer": [

    {
      competency: "Backend",
      type: "behavioral",
      text: "Tell me about your backend development experience."
    },

    {
      competency: "REST API",
      type: "technical",
      text: "Explain how a REST API works."
    },

    {
      competency: "Scalability",
      type: "technical",
      text: "How would you design a scalable backend service?"
    },

    {
      competency: "Error Handling",
      type: "technical",
      text: "How would you handle errors in a backend application?"
    },

    {
      competency: "Project Experience",
      type: "project",
      text: "Describe an important backend project you worked on."
    }

  ]

};


/* ---------------------------------------------------
   START
--------------------------------------------------- */

function startInterview() {

  state.role = document.getElementById("jobSelect").value;

  state.currentQuestion = 0;
  state.answers = [];
  state.evaluations = [];
  state.followupActive = false;

  state.questions = questionBank[state.role];

  document.getElementById("setupScreen").classList.add("hidden");

  document.getElementById("interviewScreen").classList.remove("hidden");

  showQuestion();

}


/* ---------------------------------------------------
   SHOW QUESTION
--------------------------------------------------- */

function showQuestion() {

  const q = state.questions[state.currentQuestion];

  document.getElementById("progress").innerText =
    `Question ${state.currentQuestion + 1} of ${state.questions.length}`;

  document.getElementById("competency").innerText =
    q.competency;

  document.getElementById("questionType").innerText =
    q.type;

  document.getElementById("questionText").innerText =
    q.text;

  document.getElementById("answerInput").value = "";

  document.getElementById("status").innerHTML = "";

}


/* ---------------------------------------------------
   GROQ CALL
--------------------------------------------------- */

async function callGroq(messages) {

  const response = await fetch("/api/chat", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      messages
    })

  });


  const data = await response.json();


  if (!response.ok) {

    throw new Error(
      data.error || "AI request failed"
    );

  }


  return data.choices[0].message.content;

}


/* ---------------------------------------------------
   AI EVALUATION
--------------------------------------------------- */

async function evaluateWithAI(question, answer) {

  const systemPrompt = `

You are the evaluation engine for VELLEI,
an AI mock interview platform.

Evaluate the candidate answer using this rubric:

Relevance: 15%
Technical Correctness: 25%
Depth and Reasoning: 20%
Evidence and Examples: 15%
Problem Solving: 15%
Communication: 10%

Return ONLY valid JSON.

Required format:

{
  "relevance": 0,
  "correctness": 0,
  "depth": 0,
  "evidence": 0,
  "problem_solving": 0,
  "communication": 0,
  "overall_score": 0,
  "needs_followup": true,
  "followup_reason": "",
  "strengths": [],
  "gaps": [],
  "evidence_points": []
}

Scores must be between 0 and 100.

`;


  const userPrompt = `

Target role:
${state.role}

Question:
${question.text}

Competency:
${question.competency}

Candidate answer:
${answer}

Evaluate the answer according to the rubric.

`;


  const result = await callGroq([

    {
      role: "system",
      content: systemPrompt
    },

    {
      role: "user",
      content: userPrompt
    }

  ]);


  let cleaned = result.trim();

  cleaned = cleaned
    .replace(/^```json/i, "")
    .replace(/^```/i, "")
    .replace(/```$/i, "")
    .trim();


  return JSON.parse(cleaned);

}


/* ---------------------------------------------------
   AI FOLLOW-UP
--------------------------------------------------- */

async function generateFollowup(question, answer, evaluation) {

  const prompt = `

You are the adaptive interviewer for VELLEI.

Target role:
${state.role}

Original question:
${question.text}

Candidate answer:
${answer}

Evaluation:
${JSON.stringify(evaluation)}

Generate ONE concise follow-up question.

Rules:

- Ask for clarification if the answer is vague.
- Ask for a concrete example if evidence is weak.
- Ask about reasoning or trade-offs if depth is weak.
- Do not repeat the original question.
- Do not reveal scoring criteria.
- Return only the question text.

`;


  return await callGroq([

    {
      role: "system",
      content: "You are a professional adaptive interviewer."
    },

    {
      role: "user",
      content: prompt
    }

  ]);

}


/* ---------------------------------------------------
   SUBMIT ANSWER
--------------------------------------------------- */

async function submitAnswer() {

  const answerBox =
    document.getElementById("answerInput");

  const answer =
    answerBox.value.trim();


  if (!answer) {

    alert("Please enter an answer.");

    return;

  }


  const button =
    document.getElementById("submitButton");

  button.disabled = true;

  button.innerText = "AI is evaluating...";


  document.getElementById("status").innerHTML =
    `<div class="loading">
      VELLEI AI is evaluating your answer...
    </div>`;


  try {

    if (state.followupActive) {

      const followupEvaluation =
        await evaluateWithAI(
          {
            ...state.originalQuestion,
            text: state.followupQuestion
          },
          answer
        );


      state.answers.push({

        question:
          state.followupQuestion,

        answer,

        followup: true

      });


      state.evaluations.push(
        followupEvaluation
      );


      state.followupActive = false;

      state.followupQuestion = "";

      state.currentQuestion++;

    }

    else {

      const question =
        state.questions[state.currentQuestion];


      const evaluation =
        await evaluateWithAI(
          question,
          answer
        );


      state.answers.push({

        question:
          question.text,

        answer,

        followup: false

      });


      state.evaluations.push(
        evaluation
      );


      if (
        evaluation.needs_followup &&
        state.currentQuestion <
          state.questions.length
      ) {

        const followup =
          await generateFollowup(
            question,
            answer,
            evaluation
          );


        state.originalQuestion =
          question;

        state.followupQuestion =
          followup;

        state.followupActive =
          true;


        document.getElementById(
          "questionText"
        ).innerText = followup;


        document.getElementById(
          "competency"
        ).innerText =
          question.competency;


        document.getElementById(
          "questionType"
        ).innerText =
          "adaptive follow-up";


        document.getElementById(
          "progress"
        ).innerText =
          `Follow-up for Question ${
            state.currentQuestion + 1
          }`;


        document.getElementById(
          "answerInput"
        ).value = "";


        document.getElementById(
          "status"
        ).innerHTML =
          `<div class="loading">
            VELLEI detected that more evidence is needed.
          </div>`;


        button.disabled = false;

        button.innerText =
          "Submit Follow-up";

        return;

      }


      state.currentQuestion++;

    }


    if (
      state.currentQuestion >=
      state.questions.length
    ) {

      generateReport();

    }

    else {

      showQuestion();

    }

  }

  catch (error) {

    console.error(error);

    document.getElementById("status").innerHTML =
      `<div class="error">
        AI Error: ${escapeHTML(error.message)}
      </div>`;

  }


  button.disabled = false;

  button.innerText = "Submit Answer";

}


/* ---------------------------------------------------
   REPORT
--------------------------------------------------- */

function generateReport() {

  document
    .getElementById("interviewScreen")
    .classList.add("hidden");


  document
    .getElementById("reportScreen")
    .classList.remove("hidden");


  const evaluations =
    state.evaluations;


  if (!evaluations.length) {

    return;

  }


  const average =
    evaluations.reduce(
      (sum, e) =>
        sum + Number(e.overall_score || 0),
      0
    ) / evaluations.length;


  document.getElementById(
    "overallScore"
  ).innerHTML =

    `<div class="score">
      Overall Score: ${Math.round(average)}/100
    </div>`;


  const strengths = [];

  const gaps = [];


  evaluations.forEach(e => {

    if (Array.isArray(e.strengths)) {

      strengths.push(...e.strengths);

    }

    if (Array.isArray(e.gaps)) {

      gaps.push(...e.gaps);

    }

  });


  document.getElementById(
    "strengths"
  ).innerHTML =

    [...new Set(strengths)]
      .map(
        x =>
          `<div class="report-item">
            ✓ ${escapeHTML(x)}
          </div>`
      )
      .join("");


  document.getElementById(
    "gaps"
  ).innerHTML =

    [...new Set(gaps)]
      .map(
        x =>
          `<div class="report-item">
            • ${escapeHTML(x)}
          </div>`
      )
      .join("");


  document.getElementById(
    "recommendations"
  ).innerHTML = `

    <div class="report-item">
      Practice giving concrete examples from your projects.
    </div>

    <div class="report-item">
      Explain technical reasoning and trade-offs.
    </div>

    <div class="report-item">
      Include measurable outcomes when describing work.
    </div>

  `;


  document.getElementById(
    "transcript"
  ).innerHTML =

    state.answers
      .map(
        (item, index) => `

          <div class="report-item">

            <strong>
              ${index + 1}. ${escapeHTML(item.question)}
            </strong>

            <p>
              ${escapeHTML(item.answer)}
            </p>

          </div>

        `
      )
      .join("");

}


/* ---------------------------------------------------
   SECURITY
--------------------------------------------------- */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
